name: Build and Release Rothu Flux v1.49.0 /comp

on:
  workflow_dispatch:
  push:
    branches:
      - rothuflux-v1.49.0-comp
    paths:
      - 'source-parts/READY'
      - 'source-parts/rothuflux-v1.49.0-source.tar.xz.b64'
      - '.github/workflows/rothuflux-v1.49.0.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out /comp branch
        uses: actions/checkout@v4

      - name: Reconstruct validated Rothu Flux source
        shell: bash
        run: |
          test -f source-parts/rothuflux-v1.49.0-source.tar.xz.b64
          base64 -d source-parts/rothuflux-v1.49.0-source.tar.xz.b64 > rothuflux-v1.49.0-source.tar.xz
          echo "ef57055086714231d28d60cbb5d076b7de1dda8867d88d31ff6d56fa6b12a35a  rothuflux-v1.49.0-source.tar.xz" |echo "a06e076209a1e3c487001ce842a29431341fb78cb96fda24e0fdf998086ba3c6  rothuflux-v1.49.0-source.tar.xz" |echo "fb6e55972e307e019e99f40e7a9cc36db34ea611eb09c29ef495e9a289d19992  rothuflux-v1.49.0-source.tar.xz" | sha256sum --check
          xz -t rothuflux-v1.49.0-source.tar.xz
          mkdir workspace
          tar -xJf rothuflux-v1.49.0-source.tar.xz -C workspace
          PROJECT_DIR="$PWD/workspace/rothuflux-v1.49.0"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/src/main/resources/fabric.mod.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
          cache-read-only: false

      - name: Verify Rothu Flux project metadata
        run: |
          grep -q '^minecraft_version=1.21.11$' "$PROJECT_DIR/gradle.properties"
          grep -q '^mod_version=1.49.0$' "$PROJECT_DIR/gradle.properties"
          grep -q '^archives_base_name=rothu-flux$' "$PROJECT_DIR/gradle.properties"
          grep -q 'cropGeneTableEditCost = 80L' "$PROJECT_DIR/src/main/java/com/noobvill/rothuflux/config/ModConfig.java"

      - name: Compile and package all /comp artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace build

      - name: Verify requested artifacts
        shell: bash
        run: |
          GAME_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0.jar"
          DEOBF_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0-deobf.jar"
          API_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0-api.jar"
          SRC_ZIP="$PROJECT_DIR/build/distributions/rothu-flux-1.49.0-src.zip"

          test -s "$GAME_JAR"
          test -s "$DEOBF_JAR"
          test -s "$API_JAR"
          test -s "$SRC_ZIP"

          unzip -p "$GAME_JAR" fabric.mod.json | grep -q '"id": "rothuflux"'
          unzip -l "$GAME_JAR" | grep -q 'com/noobvill/rothuflux/RothuFlux.class'
          unzip -l "$GAME_JAR" | grep -q 'com/noobvill/rothuflux/genetics/CropGeneticsManager.class'
          unzip -l "$API_JAR" | grep -q 'com/noobvill/rothuflux/api/RothuFluxApi.class'
          unzip -l "$DEOBF_JAR" | grep -q 'com/noobvill/rothuflux/RothuFlux.class'
          unzip -l "$SRC_ZIP" | grep -q 'build.gradle'

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0.jar" release/rothu-flux-1.49.0-game-ready.jar
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0-deobf.jar" release/
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0-api.jar" release/
          cp "$PROJECT_DIR/build/distributions/rothu-flux-1.49.0-src.zip" release/
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rothu-flux-v1.49.0-comp
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.49.0-comp --yes --cleanup-tag || true
          gh release create v1.49.0-comp release/* \
            --target "$GITHUB_SHA" \
            --title "Rothu Flux v1.49.0 /comp" \
            --notes "Verified /comp build for Fabric 1.21.11: game-ready JAR, deobfuscated JAR, API JAR, source ZIP, and SHA-256 checksums."
