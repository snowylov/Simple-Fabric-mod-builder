name: Build Noobvill Power and Forcefields

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source-1.4.0.zip.b64'
      - '.github/workflows/java21-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build bundle
        uses: actions/checkout@v4

      - name: Reconstruct validated source
        run: |
          base64 -d source-1.4.0.zip.b64 > source.zip
          echo "63d92114e5481cb1f4e28701232f2ec210e543fdabac2d354cad1c2f48f1f9ff  source.zip" | sha256sum --check
          mkdir workspace
          unzip -q source.zip -d workspace

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Reuse Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and package artifacts
        working-directory: workspace
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Verify requested deliverables
        run: |
          test -f workspace/build/libs/noobvill-power-forcefields-1.4.0.jar
          test -f workspace/build/libs/noobvill-power-forcefields-1.4.0-deobf.jar
          test -f workspace/build/distributions/noobvill-power-forcefields-1.4.0-api.zip
          unzip -p workspace/build/libs/noobvill-power-forcefields-1.4.0.jar fabric.mod.json | grep -q '"id": "noobvill_power"'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.4.0.jar | grep -q 'com/noobvill/power/api/PowerContentApi.class'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.4.0.jar | grep -q 'com/noobvill/power/EmpBlock.class'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.4.0.jar | grep -q 'assets/noobvill_power/blockstates/cobblestone_piston.json'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.4.0.jar | grep -q 'assets/noobvill_power/textures/block/cobblestone_piston_side.png'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.4.0.jar | grep -q 'data/noobvill_power/recipe/cobblestone_piston.json'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.4.0-deobf.jar | grep -q 'com/noobvill/power/api/PowerContentApi.class'
          unzip -l workspace/build/distributions/noobvill-power-forcefields-1.4.0-api.zip | grep -q 'PowerContentApi.java'

      - name: Collect requested deliverables
        run: |
          mkdir release
          cp workspace/build/libs/noobvill-power-forcefields-1.4.0.jar release/
          cp workspace/build/libs/noobvill-power-forcefields-1.4.0-deobf.jar release/
          cp workspace/build/distributions/noobvill-power-forcefields-1.4.0-api.zip release/
          cp source.zip release/noobvill-power-forcefields-1.4.0-source.zip
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload requested deliverables
        uses: actions/upload-artifact@v4
        with:
          name: noobvill-power-forcefields-1.4.0
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified artifacts branch
        run: |
          mkdir /tmp/noobvill-release
          for artifact in release/*; do base64 -w0 "$artifact" > "/tmp/noobvill-release/$(basename "$artifact").b64"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-artifacts-stage
          git rm -rf .
          git clean -fdx
          cp /tmp/noobvill-release/* .
          git add .
          git commit -m "Verified Noobvill Power and Forcefields 1.4.0 artifacts"
          git push --force origin HEAD:build-artifacts
