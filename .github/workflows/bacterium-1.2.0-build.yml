name: Build Bacterium 1.2.0

on:
  push:
    branches:
      - build/bacterium-1.2.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract source
        run: |
          rm -rf bacterium-src
          mkdir bacterium-src
          unzip -q bacterium-1.2.0-source.zip -d bacterium-src
      - name: Build
        id: build
        working-directory: bacterium-src
        shell: bash
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          status=$?
          cat build.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bacterium-1.2.0-build
          path: |
            bacterium-src/build.log
            bacterium-src/build/libs/*.jar
          if-no-files-found: warn
