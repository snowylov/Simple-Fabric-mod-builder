name: Universal Tool APIs 1.4 Build and Release

on:
  push:
    branches: [ universal-tool-apis-v1.4 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api

    steps:
      - uses: actions/checkout@v4

      - name: Apply Universal Tool APIs 1.3 source patch
        working-directory: .
        run: |
          tr -cd 'A-Za-z0-9+/=' < uta130_patch.b64 | base64 -d > uta130_patch.tar.gz
          tar -xzf uta130_patch.tar.gz -C universal-crowbar-api

      - name: Apply Universal Tool APIs 1.4 source patch
        working-directory: .
        run: |
          cat uta140_chunk_00 uta140_chunk_01 uta140_chunk_02 uta140_chunk_03 | tr -cd 'A-Za-z0-9+/=' > uta140_patch.b64
          base64 -d uta140_patch.b64 > uta140_patch.tar.gz
          tar -xzf uta140_patch.tar.gz -C universal-crowbar-api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build and verify
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/libs/universal-tool-apis-1.4.0.jar release/universal-tool-apis-1.4.0-game-ready.jar
          cp build/libs/universal-tool-apis-1.4.0-deobf.jar release/universal-tool-apis-1.4.0-deobf.jar
          cp build/libs/universal-tool-apis-1.4.0-api.jar release/universal-tool-apis-1.4.0-api.jar
          cp build/libs/universal-tool-apis-1.4.0-sources.jar release/universal-tool-apis-1.4.0-sources.jar
          for f in release/*.jar; do unzip -t "$f" >/dev/null; done

      - uses: actions/upload-artifact@v4
        with:
          name: universal-tool-apis-1.4.0
          path: universal-crowbar-api/release/*.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 release/*.jar --clobber
          else
            gh release create v1.4.0 release/*.jar \
              --title "Universal Tool APIs 1.4.0" \
              --notes "Fabric 1.21.11 / Java 21. Adds optional Universal Wrench compatibility adapters for Tech Reborn, Create-compatible IWrenchable blocks, and PolyFactory; Universal Elytra API; Universal Spear API; Totems and Charms API with an unregistered Charm of Keeping III example; and Projectile Damage API with 7 hooks and 4 attributes."
          fi
