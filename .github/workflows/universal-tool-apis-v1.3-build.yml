name: Universal Tool APIs 1.3 Build
on:
  push:
    branches: [ universal-tool-apis-v1.3 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api
    steps:
      - uses: actions/checkout@v4
      - name: Apply 1.3 source patch
        working-directory: .
        run: |
          base64 -d uta130_patch.b64 > uta130_patch.tar.gz
          tar -xzf uta130_patch.tar.gz -C universal-crowbar-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Collect
        run: |
          mkdir -p release
          cp build/libs/universal-tool-apis-*.jar release/
      - uses: actions/upload-artifact@v4
        with:
          name: universal-tool-apis-v1.3-build
          path: universal-crowbar-api/release/*
