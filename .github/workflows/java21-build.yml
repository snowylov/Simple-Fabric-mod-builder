name: Build Noobvill Power and Forcefields

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build bundle
        uses: actions/checkout@v4

      - name: Reconstruct validated source
        run: |
          cat source-parts/source.part-* > source.zip
          echo "e6e8bc9ae3e8439cf20edba41c3f791dd9fae3b9adab39924c8aa330c72028b0  source.zip" | sha256sum --check
          mkdir workspace
          unzip -q source.zip -d workspace

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Reuse Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and package artifacts
        working-directory: workspace
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Verify requested deliverables
        run: |
          test -f workspace/build/libs/noobvill-power-forcefields-1.3.0.jar
          test -f workspace/build/libs/noobvill-power-forcefields-1.3.0-deobf.jar
          test -f workspace/build/distributions/noobvill-power-forcefields-1.3.0-api.zip
          unzip -p workspace/build/libs/noobvill-power-forcefields-1.3.0.jar fabric.mod.json | grep -q '"id": "noobvill_power"'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.3.0.jar | grep -q 'com/noobvill/power/api/PowerContentApi.class'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.3.0.jar | grep -q 'com/noobvill/power/EmpBlock.class'
          unzip -l workspace/build/libs/noobvill-power-forcefields-1.3.0-deobf.jar | grep -q 'com/noobvill/power/api/PowerContentApi.class'
          unzip -l workspace/build/distributions/noobvill-power-forcefields-1.3.0-api.zip | grep -q 'PowerContentApi.java'

      - name: Collect requested deliverables
        run: |
          mkdir release
          cp workspace/build/libs/noobvill-power-forcefields-1.3.0.jar release/
          cp workspace/build/libs/noobvill-power-forcefields-1.3.0-deobf.jar release/
          cp workspace/build/distributions/noobvill-power-forcefields-1.3.0-api.zip release/
          cp source.zip release/noobvill-power-forcefields-1.3.0-source.zip
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload requested deliverables
        uses: actions/upload-artifact@v4
        with:
          name: noobvill-power-forcefields-1.3.0
          path: release/
          if-no-files-found: error
          retention-days: 30
