name: Shelf Faces Build

on:
  push:
    branches:
      - build/shelf-faces-1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Shelf Faces
        id: build
        working-directory: shelf-faces
        shell: bash
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          status=$?
          cat build.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shelf-faces-build
          path: |
            shelf-faces/build.log
            shelf-faces/build/libs/*.jar
          if-no-files-found: warn
