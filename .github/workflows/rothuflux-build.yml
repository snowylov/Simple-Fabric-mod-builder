name: Build RothuFlux Game-Ready JAR

on:
  workflow_dispatch:
  push:
    branches:
      - rothuflux-game-ready-build
    paths:
      - 'rothuflux-source/**'
      - '.github/workflows/rothuflux-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct RothuFlux source
        shell: bash
        run: |
          cat rothuflux-source/part-*.b64 | base64 -d > rothuflux-source.tar.xz
          echo "ba4449a4851f707053eca5c64df7ffe6066fe0c5c71bba7937b5085548052366  rothuflux-source.tar.xz" | sha256sum --check
          mkdir workspace
          tar -xJf rothuflux-source.tar.xz -C workspace
          test -f workspace/build.gradle
          test -f workspace/src/main/resources/fabric.mod.json

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Apply Minecraft 1.21.11 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("workspace/src/main/java/com/rothuflux")

          p = root / "block/MountedPlateBlock.java"
          s = p.read_text()
          s = s.replace("import net.minecraft.block.enums.AttachFace;\n", "")
          s = s.replace("import net.minecraft.state.property.DirectionProperty;\n", "")
          if "import net.minecraft.util.StringIdentifiable;" not in s:
              s = s.replace("import net.minecraft.util.BlockMirror;\n", "import net.minecraft.util.BlockMirror;\nimport net.minecraft.util.StringIdentifiable;\n")
          s = s.replace(
              "public static final EnumProperty<AttachFace> FACE = Properties.ATTACH_FACE;\n    public static final DirectionProperty FACING = Properties.HORIZONTAL_FACING;",
              """public enum MountFace implements StringIdentifiable {
                  FLOOR("floor"), CEILING("ceiling"), WALL("wall");

                  private final String id;
                  MountFace(String id) { this.id = id; }

                  @Override
                  public String asString() { return id; }
              }

              public static final EnumProperty<MountFace> FACE = EnumProperty.of("face", MountFace.class);
              public static final EnumProperty<Direction> FACING = Properties.HORIZONTAL_FACING;"""
          )
          s = s.replace("AttachFace.FLOOR", "MountFace.FLOOR")
          s = s.replace("AttachFace.CEILING", "MountFace.CEILING")
          s = s.replace("AttachFace.WALL", "MountFace.WALL")
          s = s.replace("AttachFace face;", "MountFace face;")
          p.write_text(s)

          p = root / "block/RedAlloyWireBlock.java"
          s = p.read_text()
          s = s.replace("import net.minecraft.state.property.DirectionProperty;\n", "")
          if "import net.minecraft.state.property.EnumProperty;" not in s:
              s = s.replace("import net.minecraft.state.property.IntProperty;\n", "import net.minecraft.state.property.IntProperty;\nimport net.minecraft.state.property.EnumProperty;\n")
          if "import net.minecraft.util.Identifier;" not in s:
              s = s.replace("import net.minecraft.util.Hand;\n", "import net.minecraft.util.Hand;\nimport net.minecraft.util.Identifier;\n")
          s = s.replace('public static final DirectionProperty MOUNT = DirectionProperty.of("mount");',
                        'public static final EnumProperty<Direction> MOUNT = EnumProperty.of("mount", Direction.class);')
          p.write_text(s)

          for p in root.rglob("*.java"):
              s = p.read_text()
              s = s.replace("world.isClient", "world.isClient()")
              s = s.replace("world.isClient()()", "world.isClient()")
              s = s.replace("world.updateNeighborsAlways(pos, state.getBlock());",
                            "world.updateNeighborsAlways(pos, state.getBlock(), null);")
              s = s.replace("world.updateNeighborsAlways(pos, this);",
                            "world.updateNeighborsAlways(pos, this, null);")
              p.write_text(s)
          PY

      - name: Update Gradle wrapper to 9.2.0
        working-directory: workspace
        run: |
          gradle wrapper --gradle-version 9.2.0 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build Fabric mod with updated gradlew
        working-directory: workspace
        run: ./gradlew clean build --stacktrace --warning-mode all --no-daemon

      - name: Verify game-ready JAR
        shell: bash
        run: |
          GAME_JAR="$(find workspace/build/libs -maxdepth 1 -type f -name 'rothuflux-surface-redstone-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$GAME_JAR"
          unzip -p "$GAME_JAR" fabric.mod.json | grep -q '"id": "rothuflux"'
          unzip -l "$GAME_JAR" | grep -q 'com/rothuflux/RothuFluxMod.class'
          unzip -l "$GAME_JAR" | grep -q 'assets/rothuflux/blockstates/red_alloy_wire.json'
          unzip -l "$GAME_JAR" | grep -q 'assets/rothuflux/textures/item/red_alloy_pen.png'
          mkdir -p release
          cp "$GAME_JAR" release/rothuflux-surface-redstone-1.0.0.jar
          sha256sum release/rothuflux-surface-redstone-1.0.0.jar > release/SHA256SUMS.txt

      - name: Upload game-ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: rothuflux-surface-redstone-1.0.0-game-ready
          path: release/
          if-no-files-found: error
          retention-days: 30
