name: Publish Shelf Faces 1.0.0

on:
  push:
    branches: [ build/shelf-faces-1.0.0 ]
    paths:
      - ".github/workflows/shelf-faces-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Shelf Faces
        working-directory: shelf-faces
        run: gradle clean build --stacktrace
      - name: Prepare game-ready JAR
        working-directory: shelf-faces
        run: |
          mkdir -p release
          MAIN_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-api.jar' | head -1)"
          test -n "$MAIN_JAR"
          cp "$MAIN_JAR" release/shelf-faces-1.0.0-game-ready.jar
          unzip -t release/shelf-faces-1.0.0-game-ready.jar >/dev/null
      - name: Publish GitHub Release
        working-directory: shelf-faces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view shelf-faces-v1.0.0 >/dev/null 2>&1; then
            gh release upload shelf-faces-v1.0.0 release/shelf-faces-1.0.0-game-ready.jar --clobber
          else
            gh release create shelf-faces-v1.0.0 release/shelf-faces-1.0.0-game-ready.jar \
              --title "Shelf Faces 1.0.0" \
              --notes "Standalone Fabric 1.21.11 Shelf Faces game-ready JAR, including the client renderer."
          fi
