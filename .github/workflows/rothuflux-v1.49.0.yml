name: Build Rothu Flux v1.49.0

on:
  workflow_dispatch:
  push:
    branches:
      - rothuflux-v1.49.0-build
    paths:
      - 'rothuflux-v1.49.0-source.zip.b64'
      - '.github/workflows/rothuflux-v1.49.0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Verify source bundle exists
        run: |
          test -f rothuflux-v1.49.0-source.zip.b64 || {
            echo "::error::Upload rothuflux-v1.49.0-source.zip.b64 to this branch first."
            exit 1
          }

      - name: Reconstruct validated Rothu Flux source
        run: |
          base64 -d rothuflux-v1.49.0-source.zip.b64 > rothuflux-v1.49.0-source.zip
          echo "f7111e982d71bfb1bcb9edbc1c2573b9bf102d955a877afbaaddbf2330fcbfd4  rothuflux-v1.49.0-source.zip" | sha256sum --check
          mkdir workspace
          unzip -q rothuflux-v1.49.0-source.zip -d workspace
          PROJECT_DIR="$(find workspace -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: false

      - name: Static sanity checks
        run: |
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/src/main/resources/fabric.mod.json"
          grep -q '^minecraft_version=1.21.11$' "$PROJECT_DIR/gradle.properties"
          grep -q '^mod_version=1.49.0$' "$PROJECT_DIR/gradle.properties"
          grep -q 'cropGeneTableEditCost = 80L' "$PROJECT_DIR/src/main/java/com/noobvill/rothuflux/config/ModConfig.java"
          ! grep -R --line-number 'renderBackground' "$PROJECT_DIR/src/main/java/com/noobvill/rothuflux/genetics/client" "$PROJECT_DIR/src/main/java/com/noobvill/rothuflux/client/screen"

      - name: Compile and package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace build

      - name: Verify requested artifacts
        run: |
          GAME_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0.jar"
          DEOBF_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0-deobf.jar"
          API_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0-api.jar"
          SRC_ZIP="$PROJECT_DIR/build/distributions/rothu-flux-1.49.0-src.zip"

          test -f "$GAME_JAR"
          test -f "$DEOBF_JAR"
          test -f "$API_JAR"
          test -f "$SRC_ZIP"

          unzip -p "$GAME_JAR" fabric.mod.json | grep -q '"id": "rothuflux"'
          unzip -l "$GAME_JAR" | grep -q 'com/noobvill/rothuflux/RothuFlux.class'
          unzip -l "$GAME_JAR" | grep -q 'com/noobvill/rothuflux/genetics/CropGeneticsManager.class'
          unzip -l "$API_JAR" | grep -q 'com/noobvill/rothuflux/api/RothuFluxApi.class'

      - name: Collect release files
        run: |
          mkdir release
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0.jar" release/rothu-flux-1.49.0-game-ready.jar
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0-deobf.jar" release/
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0-api.jar" release/
          cp "$PROJECT_DIR/build/distributions/rothu-flux-1.49.0-src.zip" release/
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload Rothu Flux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rothu-flux-v1.49.0
          path: release/
          if-no-files-found: error
          retention-days: 30
