name: Universal Tool APIs 1.5 Build

on:
  push:
    branches: [ universal-tool-apis-v1.5 ]
    paths:
      - ".github/workflows/universal-tool-apis-v1.5-build.yml"
      - "uta150_patch.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct known-good Universal Tool APIs 1.3 source
        working-directory: .
        run: |
          tr -cd 'A-Za-z0-9+/=' < uta130_patch.b64 | base64 -d > /tmp/uta130_patch.tar.gz
          tar -xzf /tmp/uta130_patch.tar.gz -C universal-crowbar-api

      - name: Apply Fir GUI 1.5 patch
        working-directory: .
        run: |
          tr -cd 'A-Za-z0-9+/=' < uta150_patch.b64 | base64 -d > /tmp/uta150_patch.tar.gz
          tar -xzf /tmp/uta150_patch.tar.gz -C universal-crowbar-api

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp build/libs/universal-tool-apis-1.5.0.jar release/universal-tool-apis-1.5.0-game-ready.jar
          cp build/libs/universal-tool-apis-1.5.0-deobf.jar release/universal-tool-apis-1.5.0-deobf.jar
          cp build/libs/universal-tool-apis-1.5.0-api.jar release/universal-tool-apis-1.5.0-api.jar
          cp build/libs/universal-tool-apis-1.5.0-sources.jar release/universal-tool-apis-1.5.0-sources.jar
          for f in release/*.jar; do unzip -t "$f" >/dev/null; done

      - uses: actions/upload-artifact@v4
        with:
          name: universal-tool-apis-1.5.0
          path: universal-crowbar-api/release/*.jar
