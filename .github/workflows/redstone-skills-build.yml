name: Build Redstone Skills

on:
  push:
    branches: [redstone-skills-flower-build]
    paths:
      - 'redstone-skills-source/**'
      - '.github/workflows/redstone-skills-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          cat redstone-skills-source/part-*.b64 > source.zip.b64
          base64 -d source.zip.b64 > source.zip
          echo "5cdcc99c0113d9a430d979ec6fe37150e65179a494012f88597c63eea4ccc7a2  source.zip" | sha256sum --check
          mkdir workspace
          unzip -q source.zip -d workspace
          test -f workspace/redstone-skills/build.gradle
          test -f workspace/redstone-skills/src/main/resources/fabric.mod.json

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Compile and package
        working-directory: workspace/redstone-skills
        run: gradle build --stacktrace --no-daemon

      - name: Verify game-ready JAR
        run: |
          JAR="workspace/redstone-skills/build/libs/redstone-skills-1.0.1.jar"
          test -f "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "redstone-skills"'
          unzip -l "$JAR" | grep -q 'com/noobvill/redstoneskills/RedstoneSkills.class'
          unzip -l "$JAR" | grep -q 'com/noobvill/redstoneskills/block/WirelessRedstoneBlock.class'
          unzip -l "$JAR" | grep -q 'com/noobvill/redstoneskills/block/RedstoneTorchControllerBlock.class'
          unzip -l "$JAR" | grep -q 'redstone-skills.mixins.json'
          unzip -l "$JAR" | grep -q 'assets/redstone-skills/textures/block/wireless_redstone_block_on.png'
          unzip -l "$JAR" | grep -q 'assets/redstone-skills/textures/block/wireless_redstone_block_off.png'

      - name: Upload game-ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: redstone-skills-1.0.1-game-ready
          path: workspace/redstone-skills/build/libs/redstone-skills-1.0.1.jar
          if-no-files-found: error
          retention-days: 30
