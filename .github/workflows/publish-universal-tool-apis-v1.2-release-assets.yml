name: Publish Universal Tool APIs 1.2.0 Assets

on:
  push:
    branches: [ universal-tool-apis-v1.2 ]
    paths:
      - ".github/workflows/publish-universal-tool-apis-v1.2-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Build exact 1.2.0 assets
        run: gradle clean build --stacktrace

      - name: Rename release assets
        run: |
          mkdir -p release
          cp build/libs/universal-tool-apis-1.2.0.jar release/universal-tool-apis-1.2.0-game-ready.jar
          cp build/libs/universal-tool-apis-1.2.0-api.jar release/universal-tool-apis-1.2.0-api.jar
          cp build/libs/universal-tool-apis-1.2.0-sources.jar release/universal-tool-apis-1.2.0-sources.jar

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 release/universal-tool-apis-1.2.0-game-ready.jar release/universal-tool-apis-1.2.0-api.jar release/universal-tool-apis-1.2.0-sources.jar --clobber
          else
            gh release create v1.2.0 release/universal-tool-apis-1.2.0-game-ready.jar release/universal-tool-apis-1.2.0-api.jar release/universal-tool-apis-1.2.0-sources.jar \
              --title "Universal Tool APIs 1.2.0" \
              --notes "Fabric 1.21.11 / Java 21 release with game-ready, API, and Sources JARs."
          fi
