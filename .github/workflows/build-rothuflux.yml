name: Build RothuFlux Game Ready Jar

on:
  workflow_dispatch:
  push:
    branches:
      - rothuflux-game-ready-build
    paths:
      - 'rothuflux-tar/**'
      - '.github/workflows/build-rothuflux.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat rothuflux-tar/part-*.b64 > rothuflux_source.tar.xz.b64
          base64 -d rothuflux_source.tar.xz.b64 > rothuflux_source.tar.xz
          mkdir workspace
          tar -xJf rothuflux_source.tar.xz -C workspace --strip-components=1
          test -f workspace/build.gradle
          test -f workspace/settings.gradle
          test -f workspace/src/main/resources/fabric.mod.json
          echo "Source reconstructed successfully."

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compile and package
        working-directory: workspace
        run: gradle clean build --stacktrace --warning-mode all

      - name: Verify game-ready JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          GAME_JAR="$(find workspace/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-deobf.jar' | head -n 1)"
          test -n "$GAME_JAR"
          unzip -p "$GAME_JAR" fabric.mod.json | grep -q '"id": "rothuflux"'
          unzip -l "$GAME_JAR" | grep -q 'com/rothuflux/RothuFluxMod.class'
          cp "$GAME_JAR" release/rothuflux-surface-redstone-1.0.0-game-ready.jar
          sha256sum release/rothuflux-surface-redstone-1.0.0-game-ready.jar > release/SHA256SUMS.txt

      - name: Upload game-ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: rothuflux-game-ready
          path: release/
          if-no-files-found: error
          retention-days: 30

# Rebuild after all compact source chunks were uploaded.
