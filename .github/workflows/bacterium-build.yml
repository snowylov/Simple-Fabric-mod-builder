name: Build Bacterium

on:
  push:
    branches:
      - build/bacterium-1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract and patch source
        run: |
          rm -rf bacterium-src
          mkdir bacterium-src
          unzip -q bacterium-source.zip -d bacterium-src
          sed -i 's/Blocks\.GRASS/Blocks.SHORT_GRASS/g' bacterium-src/src/main/java/com/alex/bacterium/BacteriumMod.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("bacterium-src/src/main/java/com/alex/bacterium/BacteriumBlock.java")
          s = p.read_text()
          s = s.replace("        return null;", "        return createCodec(settings -> new BacteriumBlock(mode, settings));")
          p.write_text(s)
          PY
      - name: Build
        id: build
        working-directory: bacterium-src
        shell: bash
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          status=$?
          cat build.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bacterium-build
          path: |
            bacterium-src/build.log
            bacterium-src/build/libs/*.jar
          if-no-files-found: warn
