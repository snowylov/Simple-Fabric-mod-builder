name: Build Bacterium

on:
  push:
    branches:
      - build/bacterium-1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract and patch source
        run: |
          rm -rf bacterium-src
          mkdir bacterium-src
          unzip -q bacterium-source.zip -d bacterium-src
          python3 - <<'PY'
          from pathlib import Path

          mod = Path("bacterium-src/src/main/java/com/alex/bacterium/BacteriumMod.java")
          ms = mod.read_text()
          ms = ms.replace("Blocks.GRASS ||", "Blocks.SHORT_GRASS ||")
          ms = ms.replace("if (!current.equals(target))", "if (current.getBlock() != target.getBlock())")
          mod.write_text(ms)

          block = Path("bacterium-src/src/main/java/com/alex/bacterium/BacteriumBlock.java")
          bs = block.read_text()
          bs = bs.replace(
              "import net.minecraft.world.World;\n",
              "import net.minecraft.world.World;\nimport net.minecraft.world.block.WireOrientation;\n"
          )
          bs = bs.replace(
              "        return null;",
              "        return createCodec(settings -> new BacteriumBlock(mode, settings));"
          )
          marker = "    @Override\n    protected void randomTick(BlockState state, ServerWorld world, BlockPos pos, Random random) {\n"
          neighbor = "    @Override\n    protected void neighborUpdate(BlockState state, World world, BlockPos pos, Block sourceBlock, @Nullable WireOrientation orientation, boolean notify) {\n        super.neighborUpdate(state, world, pos, sourceBlock, orientation, notify);\n        if (world instanceof ServerWorld serverWorld) {\n            BacteriumMod.tryActivate(serverWorld, pos, mode);\n        }\n    }\n\n"
          if "protected void neighborUpdate" not in bs:
              bs = bs.replace(marker, neighbor + marker)
          block.write_text(bs)
          PY
      - name: Build
        id: build
        working-directory: bacterium-src
        shell: bash
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          status=$?
          cat build.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bacterium-build
          path: |
            bacterium-src/build.log
            bacterium-src/build/libs/*.jar
          if-no-files-found: warn
