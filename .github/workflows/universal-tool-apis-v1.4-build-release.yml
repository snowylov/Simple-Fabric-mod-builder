name: Universal Tool APIs 1.4 Build and Release

on:
  push:
    branches: [ universal-tool-apis-v1.4 ]
    paths:
      - ".github/workflows/universal-tool-apis-v1.4-build-release.yml"
      - "source-1.4.0.zip.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api

    steps:
      - uses: actions/checkout@v4

      - name: Apply Universal Tool APIs 1.4 source archive
        working-directory: .
        run: |
          rm -rf /tmp/uta140-source
          mkdir -p /tmp/uta140-source
          tr -cd 'A-Za-z0-9+/=' < source-1.4.0.zip.b64 | base64 -d > /tmp/source-1.4.0.zip
          unzip -q -o /tmp/source-1.4.0.zip -d /tmp/uta140-source
          if [ -f /tmp/uta140-source/build.gradle ]; then
            SOURCE_ROOT=/tmp/uta140-source
          else
            SOURCE_ROOT="$(find /tmp/uta140-source -mindepth 1 -maxdepth 2 -type f -name build.gradle -printf '%h\n' | head -1)"
          fi
          if [ -z "$SOURCE_ROOT" ]; then
            echo "Could not locate build.gradle in source archive"
            find /tmp/uta140-source -maxdepth 3 -type f | head -100
            exit 1
          fi
          rm -rf universal-crowbar-api
          mkdir -p universal-crowbar-api
          cp -a "$SOURCE_ROOT"/. universal-crowbar-api/

      - name: Fix 1.4 mapping/compiler adjustments
        run: |
          if grep -q 'float fallDistance' src/main/java/com/alex/universalelytraapi/api/ElytraFallContext.java; then
            sed -i 's/        float fallDistance,/        double fallDistance,/' src/main/java/com/alex/universalelytraapi/api/ElytraFallContext.java
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build and verify
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release
          echo "Built files:"
          ls -la build/libs
          MAIN_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-api.jar' ! -name '*-deobf.jar' | head -1)"
          DEOBF_JAR="$(find build/libs -maxdepth 1 -type f -name '*-deobf.jar' | head -1)"
          API_JAR="$(find build/libs -maxdepth 1 -type f -name '*-api.jar' | head -1)"
          SOURCES_JAR="$(find build/libs -maxdepth 1 -type f -name '*-sources.jar' | head -1)"
          test -n "$MAIN_JAR" && test -n "$DEOBF_JAR" && test -n "$API_JAR" && test -n "$SOURCES_JAR"
          cp "$MAIN_JAR" release/universal-tool-apis-1.4.0-game-ready.jar
          cp "$DEOBF_JAR" release/universal-tool-apis-1.4.0-deobf.jar
          cp "$API_JAR" release/universal-tool-apis-1.4.0-api.jar
          cp "$SOURCES_JAR" release/universal-tool-apis-1.4.0-sources.jar
          for f in release/*.jar; do unzip -t "$f" >/dev/null; done

      - uses: actions/upload-artifact@v4
        with:
          name: universal-tool-apis-1.4.0
          path: universal-crowbar-api/release/*.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 release/*.jar --clobber
          else
            gh release create v1.4.0 release/*.jar \
              --title "Universal Tool APIs 1.4.0" \
              --notes "Fabric 1.21.11 / Java 21. Adds Universal Wrench compatibility adapters for Tech Reborn/RebornCore, Create-compatible IWrenchable blocks where available, and PolyFactory configurable blocks; Universal Elytra API; Universal Spear API; Totems and Charms API with an unregistered Charm of Keeping III example; and Projectile Damage API with 7 hooks and 4 attributes."
          fi
