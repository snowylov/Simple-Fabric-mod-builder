name: Build C. elegans Fabric 1.21.11

on:
  push:
    branches: [celegans-build]
    paths:
      - 'celegans-source/**'
      - 'celegans-build-fixes.sh'
      - '.github/workflows/celegans-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out C. elegans build branch
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat celegans-source/part-*.b64 > celegans-source.zip.b64
          base64 -d celegans-source.zip.b64 > celegans-source.zip
          echo "5801e16f0b56c31fe72101377428f20f0eb3614dcc78eaacf142407df10137ed  celegans-source.zip" | sha256sum --check
          mkdir workspace
          unzip -q celegans-source.zip -d workspace

      - name: Apply build fixes
        run: |
          chmod +x celegans-build-fixes.sh
          ./celegans-build-fixes.sh workspace

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Compile and remap game-ready JAR
        working-directory: workspace
        run: gradle build --stacktrace

      - name: Verify game-ready JAR
        run: |
          test -f workspace/build/libs/celegans-fabric-1.0.0.jar
          unzip -p workspace/build/libs/celegans-fabric-1.0.0.jar fabric.mod.json | grep -q '"id": "celegans"'
          unzip -l workspace/build/libs/celegans-fabric-1.0.0.jar | grep -q 'com/noobvill/celegans/CElegansMod.class'
          unzip -l workspace/build/libs/celegans-fabric-1.0.0.jar | grep -q 'com/noobvill/celegans/ai/WormBrain.class'
          unzip -l workspace/build/libs/celegans-fabric-1.0.0.jar | grep -q 'assets/celegans/textures/entity/c_elegans.png'

      - name: Collect deliverables
        run: |
          mkdir release
          cp workspace/build/libs/celegans-fabric-1.0.0.jar release/
          if [ -f workspace/build/libs/celegans-fabric-1.0.0-sources.jar ]; then
            cp workspace/build/libs/celegans-fabric-1.0.0-sources.jar release/
          fi
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: celegans-fabric-1.0.0-mc1.21.11
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified artifact branch
        run: |
          mkdir /tmp/celegans-release
          for artifact in release/*; do
            base64 -w0 "$artifact" > "/tmp/celegans-release/$(basename "$artifact").b64"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan celegans-artifacts-stage
          git rm -rf .
          git clean -fdx
          cp /tmp/celegans-release/* .
          git add .
          git commit -m "Verified C. elegans Fabric 1.21.11 artifacts"
          git push --force origin HEAD:celegans-build-artifacts
