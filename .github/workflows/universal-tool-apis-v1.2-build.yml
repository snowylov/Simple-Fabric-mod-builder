name: Universal Tool APIs 1.2 Build
on:
  push:
    branches: [ universal-tool-apis-v1.2 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.0' }
      - name: Build
        run: gradle clean build --stacktrace
      - name: Collect
        run: |
          mkdir -p release
          cp build/libs/universal-tool-apis-*.jar release/
      - uses: actions/upload-artifact@v4
        with:
          name: universal-tool-apis-v1.2-build
          path: universal-crowbar-api/release/*
