name: Build and Release Rothu Flux v1.49.0

on:
  workflow_dispatch:
  push:
    branches:
      - rothuflux-v1.49.0-comp
    paths:
      - 'source-parts/READY'
      - '.github/workflows/rothuflux-v1.49.0.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct validated Rothu Flux source
        shell: bash
        run: |
          test -f source-parts/source.part-000
          cp source-parts/source.part-000 rothuflux-v1.49.0-source.zip
          echo "40bdd9ed605707b003cea51d563250ebe432e7007600c9da1e854e00bb925cd4  rothuflux-v1.49.0-source.zip" | sha256sum --check
          unzip -tq rothuflux-v1.49.0-source.zip
          mkdir workspace
          unzip -q rothuflux-v1.49.0-source.zip -d workspace
          PROJECT_DIR="$(find workspace -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: false

      - name: Validate project files
        run: |
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/src/main/resources/fabric.mod.json"

      - name: Compile and package
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace build

      - name: Verify requested artifacts
        run: |
          GAME_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0.jar"
          DEOBF_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0-deobf.jar"
          API_JAR="$PROJECT_DIR/build/libs/rothu-flux-1.49.0-api.jar"

          test -f "$GAME_JAR"
          test -f "$DEOBF_JAR"
          test -f "$API_JAR"

          unzip -p "$GAME_JAR" fabric.mod.json | grep -q '"id": "rothuflux"'
          unzip -l "$GAME_JAR" | grep -q 'com/noobvill/rothuflux/RothuFlux.class'
          unzip -l "$GAME_JAR" | grep -q 'com/noobvill/rothuflux/genetics/CropGeneticsManager.class'
          unzip -l "$API_JAR" | grep -q 'com/noobvill/rothuflux/api/RothuFluxApi.class'

      - name: Collect release files
        run: |
          mkdir release
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0.jar" release/rothu-flux-1.49.0-game-ready.jar
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0-deobf.jar" release/
          cp "$PROJECT_DIR/build/libs/rothu-flux-1.49.0-api.jar" release/
          cp rothuflux-v1.49.0-source.zip release/rothu-flux-1.49.0-src.zip
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rothu-flux-v1.49.0
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.49.0-comp --yes --cleanup-tag || true
          gh release create v1.49.0-comp release/* \
            --target "$GITHUB_SHA" \
            --title "Rothu Flux v1.49.0 /comp" \
            --notes "Verified /comp build: game-ready JAR, deobfuscated JAR, API JAR, and source ZIP."
