name: Material Shears Build
on:
  push:
    branches: [ material-shears ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: material-shears
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Collect artifacts
        run: |
          mkdir -p release
          cp build/libs/material-shears-*.jar release/
      - uses: actions/upload-artifact@v4
        with:
          name: material-shears-build
          path: material-shears/release/*
