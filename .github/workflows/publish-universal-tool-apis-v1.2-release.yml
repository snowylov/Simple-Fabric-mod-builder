name: Publish Universal Tool APIs 1.2.0 Release

on:
  push:
    branches: [ universal-tool-apis-v1.2 ]
    paths:
      - ".github/workflows/publish-universal-tool-apis-v1.2-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-crowbar-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Build release artifacts
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/libs/universal-tool-apis-1.2.0.jar release/universal-tool-apis-1.2.0-game-ready.jar
          cp build/libs/universal-tool-apis-1.2.0-api.jar release/universal-tool-apis-1.2.0-api.jar
          cp build/libs/universal-tool-apis-1.2.0-sources.jar release/universal-tool-apis-1.2.0-sources.jar
          cd ..
          zip -qr universal-tool-apis/release/universal-tool-apis-1.2.0-src.zip universal-crowbar-api \
            -x "universal-crowbar-api/.gradle/*" \
               "universal-crowbar-api/build/*" \
               "universal-crowbar-api/release/*"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 release/* --clobber
          else
            gh release create v1.2.0 release/* \
              --title "Universal Tool APIs 1.2.0" \
              --notes "Fabric 1.21.11 / Java 21 release containing the game-ready JAR, API JAR, Sources JAR, and source ZIP."
          fi
